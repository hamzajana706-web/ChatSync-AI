<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatSync AI - مستقبل أتمتة الدعم الفني</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://unpkg.com"></script>
    <style>
        @import url('https://googleapis.com');
        body { font-family: 'Tajawal', 'Plus Jakarta Sans', sans-serif; }
        .neon-glow { box-shadow: 0 0 40px -10px rgba(99, 102, 241, 0.5); }
    </style>
</head>
<body class="bg-[#030712] text-gray-100 overflow-x-hidden">
    <header class="border-b border-gray-800/60 backdrop-blur-md sticky top-0 z-50 bg-[#030712]/80">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-indigo-600 p-2 rounded-xl text-white neon-glow">
                    <i data-lucide="cpu" class="w-6 h-6"></i>
                </div>
                <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-gray-200 to-indigo-400 bg-clip-text text-transparent">ChatSync AI</span>
            </div>
            <div>
                <span class="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1.5 rounded-full font-mono">v1.0.0 Ready</span>
            </div>
        </div>
    </header>
    <main class="max-w-6xl mx-auto px-4 pt-16 pb-24">
        <div class="text-center max-w-3xl mx-auto space-y-6">
            <h1 class="text-4xl sm:text-5xl font-extrabold text-white leading-tight">
                امتلك نظام أتمتة دعم <span class="bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">Intercom</span> بالذكاء الاصطناعي
            </h1>
            <p class="text-gray-400 text-lg font-light max-w-2xl mx-auto">
                أداة برمجية مصغرة متكاملة توفر على الشركات آلاف الدولارات عبر ربط تذاكر الدعم بنماذج لغوية مستقلة بضغطة زر واحدة.
            </p>
        </div>
        <div class="mt-12 border border-gray-800/80 rounded-2xl bg-[#0b0f19] overflow-hidden neon-glow p-6 sm:p-10 grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-[#0e1424] border border-gray-800 p-5 rounded-xl space-y-4">
                <span class="text-gray-400 text-sm block">الاتصال بالمنصة</span>
                <span class="text-xl font-bold font-mono text-indigo-400">Intercom API</span>
            </div>
            <div class="bg-[#0e1424] border border-gray-800 p-5 rounded-xl space-y-4">
                <span class="text-gray-400 text-sm block">تخزين البيانات</span>
                <span class="text-xl font-bold font-mono text-cyan-400">Supabase DB</span>
            </div>
            <div class="bg-[#0e1424] border border-gray-800 p-5 rounded-xl space-y-4">
                <span class="text-gray-400 text-sm block">الذكاء الاصطناعي</span>
                <span class="text-xl font-bold font-mono text-purple-400">GPT-4o / Claude</span>
            </div>
        </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
